<!DOCTYPE html>
<html>
<head><title>Diagnostic</title></head>
<body style="background:#000;color:#0f0;font-family:monospace;padding:20px;">
<h1>Diagnostic Test</h1>
<div id="log">Starting diagnostic...</div>
<script>
var log = document.getElementById('log');
function addLog(msg) {
  log.innerHTML += '<br>' + new Date().toLocaleTimeString() + ': ' + msg;
  console.log(msg);
}

addLog('Script started');

try {
  addLog('Window dimensions: ' + window.innerWidth + 'x' + window.innerHeight);
  addLog('Document readyState: ' + document.readyState);
  
  var canvas = document.createElement('canvas');
  canvas.width = 400;
  canvas.height = 300;
  document.body.appendChild(canvas);
  addLog('Canvas created and appended');
  
  var ctx = canvas.getContext('2d');
  if (ctx) {
    addLog('Canvas 2D context: OK');
    ctx.fillStyle = '#00ff00';
    ctx.fillRect(10, 10, 50, 50);
    ctx.fillStyle = '#ffffff';
    ctx.font = '16px monospace';
    ctx.fillText('Canvas works!', 10, 80);
  } else {
    addLog('Canvas 2D context: FAILED');
  }
  
  var gl = null;
  try {
    gl = canvas.getContext('webgl') || canvas.getContext('webgl2') || canvas.getContext('experimental-webgl');
  } catch(e) {
    addLog('WebGL error: ' + e.message);
  }
  
  if (gl) {
    addLog('WebGL context: OK');
    gl.clearColor(0, 0.5, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
  } else {
    addLog('WebGL context: NOT AVAILABLE');
  }
  
  addLog('Diagnostic complete');
  
} catch(e) {
  addLog('ERROR: ' + e.message);
  console.error(e);
}
</script>
</body>
</html>
